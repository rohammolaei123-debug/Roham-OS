<!DOCTYPE html>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;

#os{
  width:100%;
  height:100%;
  background:
    radial-gradient(circle at 50% -10%,#30446f 0,#151d36 38%,#080b14 100%);
  display:flex;
  flex-direction:column;
}

.status{
  height:34px;
  padding:7px 15px;
  display:flex;
  justify-content:space-between;
  font-size:13px;
}

.home{
  flex:1;
  overflow:auto;
  padding:22px 16px 105px;
}

.clock{
  font-size:54px;
  font-weight:700;
  letter-spacing:-2px;
}

.date{
  opacity:.7;
  margin-bottom:20px;
}

.search{
  height:48px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  margin-bottom:23px;
  border-radius:18px;
  background:#ffffff15;
  border:1px solid #ffffff20;
  backdrop-filter:blur(20px);
}

.search input{
  flex:1;
  color:#fff;

  border:0;
  outline:0;
}

.search button{
  background:none;
  color:#fff;

  margin:auto auto 7px;

  font-size:28px;

  transform:scale(.91);

  background:#ffffff18;
  border:1px solid #ffffff22;

<body>

<div id="os">

<header class="status">
  <span id="statusTime"></span>
  <span>▮▮▮ 📶 🔋</span>
</header>

<main class="home">

  <div class="clock" id="clock"></div>
  <div class="date" id="date"></div>

  <div class="search">
    <span>🔎</span>
    <input id="searchBox" placeholder="جستجو در Roham">
    <button onclick="searchGoogle()">↵</button>
  </div>

  <div class="grid" id="appGrid"></div>

</main>

<nav class="dock">
  <button class="app" onclick="openApp('google')">
    <div class="icon">G</div>
  </button>

  <button class="app" onclick="goHome()">
    <div class="icon">⌂</div>
  </button>

  <button class="app" onclick="openApp('ai')">
    <div class="icon">🤖</div>
  </button>

  <button class="app" onclick="openApp('settings')">
    <div class="icon">⚙️</div>
  </button>
</nav>

</div>

<div id="toast" class="toast"></div>

<div id="page" class="page">

  <div class="bar">
    <button onclick="goHome()">←</button>
    <h2 id="pageTitle"></h2>
  </div>

  <div id="pageContent" class="content"></div>

</div>

<script>

const apps = [

  ["google","Google","G","web","https://www.google.com/search?igu=1&q="],
  ["youtube","YouTube","▶️","web","https://www.youtube.com"],
  ["gmail","Gmail","✉️","web","https://mail.google.com"],
  ["ytmusic","YouTube Music","🎵","web","https://music.youtube.com"],
  ["chrome","Chrome","🌐","web","https://www.google.com/chrome/"],
  ["onedrive","OneDrive","☁️","web","https://onedrive.live.com"],
  ["photos","Google Photos","🖼️","web","https://photos.google.com"],
  ["play","Google Play","▶️","web","https://play.google.com"],

  ["ai","Roham AI","🤖","web","https://rohammolaei123-debug.github.io/Roham-Ai/"],
  ["account","Roham Account","👤","account"],
  ["browser","Roham Browser","🧭","browser"],

  ["whatsapp","WhatsApp","💬","web","https://web.whatsapp.com"],
  ["telegram","Telegram","✈️","web","https://web.telegram.org"],
  ["instagram","Instagram","📷","web","https://www.instagram.com"],
  ["vpn","Hallow VPN","🛡️","web","https://hallow.com"],

  ["camera","Camera","📸","camera"],
  ["gallery","Gallery","🌄","gallery"],
  ["files","Files","📁","files"],
  ["recorder","Voice Recorder","🎙️","recorder"],

  ["notes","Notes","📝","notes"],
  ["contacts","Contacts","👥","contacts"],
  ["calculator","Calculator","🧮","calculator"],

  ["storage","Storage","💾","storage"],
  ["settings","Settings","⚙️","settings"],
  ["wifi","Wi-Fi","📶","settings"],
  ["bluetooth","Bluetooth","🟦","settings"],
  ["airplane","Airplane Mode","✈️","settings"]

];

const grid=document.getElementById("appGrid");

apps.forEach(app=>{

  const button=document.createElement("button");

  button.className="app";

  button.innerHTML=
    `<div class="icon">${app[2]}</div>${app[1]}`;

  button.onclick=()=>openApp(app[0]);

  grid.appendChild(button);

});


function updateClock(){

  const now=new Date();

  document.getElementById("clock").textContent=
    now.toLocaleTimeString("fa-IR",{
      hour:"2-digit",
      minute:"2-digit"
    });

  document.getElementById("statusTime").textContent=
    now.toLocaleTimeString("fa-IR",{
      hour:"2-digit",
      minute:"2-digit"
    });

  document.getElementById("date").textContent=
    now.toLocaleDateString("fa-IR",{
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    });

}

setInterval(updateClock,1000);
updateClock();


function goHome(){

  document.getElementById("page").classList.remove("show");

}


function showPage(title,html){

  document.getElementById("pageTitle").textContent=title;

  document.getElementById("pageContent").innerHTML=html;

  document.getElementById("page").classList.add("show");

}


function toast(message){

  const t=document.getElementById("toast");

  t.textContent=message;

  t.style.display="block";

  setTimeout(()=>{
    t.style.display="none";
  },1800);

}


function searchGoogle(){

  const q=document.getElementById("searchBox").value.trim();

  if(!q)return;

  openWeb(
    "Google",
    "https://www.google.com/search?igu=1&q="+encodeURIComponent(q)
  );

}


function openApp(id){

  const app=apps.find(x=>x[0]===id);

  if(!app)return;

  if(app[3]==="web"){

    openWeb(app[1],app[4]);

    return;

  }

  if(id==="browser"){

    showPage(
      "Roham Browser",
      `
      <div class="webwrap">

        <div class="urlbar">
          <input id="browserURL" placeholder="https://example.com">
          <button onclick="navigateBrowser()">برو</button>
        </div>

        <iframe id="browserFrame" class="webframe"></iframe>

      </div>
      `
    );

    return;

  }


  if(id==="account"){

    const saved=
      JSON.parse(localStorage.getItem("rohamAccount")||"null");

    showPage(
      "Roham Account",
      `
      <div class="card">

        <div class="big">👤 حساب Roham</div>

        <p class="muted">
          حساب آزمایشی Roham روی همین دستگاه ذخیره می‌شود.
        </p>

        <input
          id="accountName"
          class="input"
          placeholder="نام"
          value="${saved?.name||""}"
        >

        <input
          id="accountEmail"
          class="input"
          placeholder="ایمیل"
          value="${saved?.email||""}"
        >

        <input
          id="accountPassword"
          class="input"
          type="password"
          placeholder="رمز عبور"
          value="${saved?.password||""}"
        >

        <button class="primary" onclick="saveAccount()">
          ذخیره حساب
        </button>

        <button class="primary"
          style="background:#9b3340;margin-right:6px"
          onclick="deleteAccount()">
          حذف حساب
        </button>

      </div>
      `
    );

    return;

  }


  if(id==="camera"){

    showPage(
      "Camera",
      `
      <div class="card">

        <video
          id="cameraVideo"
          autoplay
          playsinline
          style="
            width:100%;
            border-radius:16px;
            background:#000;
          ">
        </video>

        <br><br>

        <button class="primary" onclick="startCamera('environment')">
          📷 دوربین پشت
        </button>

        <button class="primary"
          style="margin-right:6px"
          onclick="startCamera('user')">
          🤳 سلفی
        </button>

        <p class="muted">
          Safari برای استفاده از دوربین اجازه دسترسی می‌خواهد.
        </p>

      </div>
      `
    );

    return;

  }


  if(id==="gallery"){

    showPage(
      "Gallery",
      `
      <div class="card">

        <input
          type="file"
          id="galleryPicker"
          accept="image/*"
          multiple
        >

        <div id="galleryOutput"></div>

      </div>
      `
    );

    setTimeout(()=>{

      document
      .getElementById("galleryPicker")
      .addEventListener("change",e=>{

        const out=document.getElementById("galleryOutput");

        out.innerHTML="";

        [...e.target.files].forEach(file=>{

          const img=document.createElement("img");

          img.className="preview";

          img.src=URL.createObjectURL(file);

          out.appendChild(img);

        });

      });

    },50);

    return;

  }


  if(id==="files"){

    showPage(
      "Files",
      `
      <div class="card">

        <input type="file" id="filePicker" multiple>

        <div id="fileList" class="muted"></div>

      </div>
      `
    );

    setTimeout(()=>{

      document
      .getElementById("filePicker")
      .addEventListener("change",e=>{

        document.getElementById("fileList").innerHTML=
          [...e.target.files]
          .map(f=>"📄 "+f.name)
          .join("<br>");

      });

    },50);

    return;

  }


  if(id==="recorder"){

    showPage(
      "Voice Recorder",
      `
      <div class="card">

        <button class="primary" onclick="startRecorder()">
          🎙️ شروع ضبط
        </button>

        <button
          class="primary"
          style="margin-right:6px;background:#9b3340"
          onclick="stopRecorder()">
          توقف
        </button>

        <p id="recordStatus" class="muted">
          آماده ضبط
        </p>

        <div id="recordings"></div>

      </div>
      `
    );

    return;

  }


  if(id==="notes"){

    const note=
      localStorage.getItem("rohamNote")||"";

    showPage(
      "Notes",
      `
      <textarea
        id="noteText"
        class="input"
        style="height:55vh"
        placeholder="یادداشت خود را بنویسید..."
      >${note}</textarea>

      <button class="primary" onclick="saveNote()">
        ذخیره
      </button>
      `
    );

    return;

  }


  if(id==="contacts"){

    showPage(
      "Contacts",
      `
      <div class="card">

        <input id="contactName"
          class="input"
          placeholder="نام">

        <input id="contactNumber"
          class="input"
          placeholder="شماره">

        <button class="primary" onclick="addContact()">
          افزودن مخاطب
        </button>

      </div>

      <div id="contactsList"></div>
      `
    );

    renderContacts();

    return;

  }


  if(id==="calculator"){

    showPage(
      "Calculator",
      `
      <input
        id="calculatorInput"
        class="input"
        placeholder="مثلاً 12*8+4"
      >

      <button class="primary" onclick="calculate()">
        محاسبه
      </button>

      <div id="calculatorResult" class="card"></div>
      `
    );

    return;

  }


  if(id==="storage"){

    showPage(
      "Storage",
      `
      <div class="card">

        <div class="big">💾 Roham Storage</div>

        <p class="muted">
          وضعیت حافظه در نسخه آزمایشی
        </p>

        <div class="row">
          <span>سیستم</span>
          <b>6.2 GB</b>
        </div>

        <div class="row">
          <span>برنامه‌ها</span>
          <b>2.8 GB</b>
        </div>

        <div class="row">
          <span>خالی</span>
          <b>18.4 GB</b>
        </div>

      </div>
      `
    );

    return;

  }


  if(id==="settings"){

    showPage(
      "Settings",
      `
      <div class="card">

        <div class="row">
          <span>📶 Wi-Fi</span>
          <b>آزمایشی</b>
        </div>

        <div class="row">
          <span>🟦 Bluetooth</span>
          <b>آزمایشی</b>
        </div>

        <div class="row">
          <span>✈️ Airplane Mode</span>
          <b>خاموش</b>
        </div>

        <div class="row">
          <span>📱 SIM</span>
          <b>نسخه Android</b>
        </div>

        <div class="row">
          <span>🤖 Roham AI</span>
          <b>فعال</b>
        </div>

        <div class="row">
          <span>Roham OS</span>
          <b>Beta 2</b>
        </div>

      </div>
      `
    );

  }

}


function openWeb(title,url){

  showPage(
    title,
    `
    <div class="webwrap">

      <div class="urlbar">

        <input
          id="webURL"
          value="${url}"
        >

        <button onclick="navigateWeb()">
          برو
        </button>

      </div>

      <iframe
        id="webFrame"
        class="webframe"
        src="${url}"
        allow="camera; microphone; geolocation; fullscreen">
      </iframe>

    </div>
    `
  );

}


function navigateWeb(){

  let url=document.getElementById("webURL").value.trim();

  if(!/^https?:\/\//i.test(url))
    url="https://"+url;

  document.getElementById("webFrame").src=url;

}


function navigateBrowser(){

  let url=document.getElementById("browserURL").value.trim();

  if(!url)return;

  if(!/^https?:\/\//i.test(url))
    url="https://"+url;

  document.getElementById("browserFrame").src=url;

}


function saveAccount(){

  const account={

    name:document.getElementById("accountName").value,

    email:document.getElementById("accountEmail").value,

    password:document.getElementById("accountPassword").value

  };

  localStorage.setItem(
    "rohamAccount",
    JSON.stringify(account)
  );

  toast("حساب Roham ذخیره شد");

}


function deleteAccount(){

  localStorage.removeItem("rohamAccount");

  toast("حساب Roham حذف شد");

}


let cameraStream=null;


async function startCamera(mode){

  try{

    if(cameraStream)
      cameraStream.getTracks().forEach(t=>t.stop());

    cameraStream=
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:mode
        },

        audio:false

      });

    document.getElementById("cameraVideo").srcObject=
      cameraStream;

  }catch(e){

    toast("دسترسی دوربین داده نشد");

  }

}


let recorder=null;
let chunks=[];


async function startRecorder(){

  try{

    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    chunks=[];

    recorder=new MediaRecorder(stream);

    recorder.ondataavailable=e=>{
      if(e.data.size)
        chunks.push(e.data);
    };

    recorder.onstop=()=>{

      const blob=
        new Blob(chunks,{type:"audio/webm"});

      const url=
        URL.createObjectURL(blob);

      document.getElementById("recordings").innerHTML+=
        `
        <div class="card">
          <audio controls src="${url}"></audio>
        </div>
        `;

      stream.getTracks().forEach(t=>t.stop());

    };

    recorder.start();

    document.getElementById("recordStatus").textContent=
      "در حال ضبط...";

  }catch(e){

    toast("دسترسی میکروفون داده نشد");

  }

}


function stopRecorder(){

  if(recorder && recorder.state!=="inactive"){

    recorder.stop();

    document.getElementById("recordStatus").textContent=
      "ضبط متوقف شد";

  }

}


function saveNote(){

  localStorage.setItem(
    "rohamNote",
    document.getElementById("noteText").value
  );

  toast("یادداشت ذخیره شد");

}


function addContact(){

  const contacts=
    JSON.parse(
      localStorage.getItem("rohamContacts")||"[]"
    );

  contacts.push({

    name:
      document.getElementById("contactName").value,

    number:
      document.getElementById("contactNumber").value

  });

  localStorage.setItem(
    "rohamContacts",
    JSON.stringify(contacts)
  );

  renderContacts();

}


function renderContacts(){

  const list=document.getElementById("contactsList");

  if(!list)return;

  const contacts=
    JSON.parse(
      localStorage.getItem("rohamContacts")||"[]"
    );

  list.innerHTML=
    contacts.map(c=>
      `
      <div class="card">
        👤 ${c.name}<br>
        📞 ${c.number}
      </div>
      `
    ).join("");

}


function calculate(){

  const expression=
    document.getElementById("calculatorInput").value;

  try{

    const result=
      Function(
        '"use strict";return ('+expression+')'
      )();

    document.getElementById("calculatorResult")
      .textContent=result;

  }catch{

    document.getElementById("calculatorResult")
      .textContent="عبارت نامعتبر است";

  }

}

</script>

</body>
</html>

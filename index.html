<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Roham OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#0b0d12;
  --panel:#151922;
  --panel2:#1d2230;
  --text:#f5f7fb;
  --muted:#9da5b5;
  --accent:#4f8cff;
  --border:rgba(255,255,255,.09);
  --danger:#ff5757;
  --success:#43d17c;
}

body.light{
  --bg:#eef1f6;
  --panel:#ffffff;
  --panel2:#e4e8ef;
  --text:#11151d;
  --muted:#626b7a;
  --border:rgba(0,0,0,.09);
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#os{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(79,140,255,.12),transparent 30%),
    radial-gradient(circle at 80% 90%,rgba(130,80,255,.10),transparent 30%),
    var(--bg);
}

#wallpaper{
  position:absolute;
  inset:0;
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  z-index:0;
  pointer-events:none;
}

#shade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.15);
  z-index:1;
  pointer-events:none;
}

#topbar{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:54px;
  padding:10px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:20;
  background:rgba(8,10,15,.48);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

body.light #topbar{
  background:rgba(255,255,255,.58);
}

.status{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  font-weight:600;
}

.status-right{
  display:flex;
  align-items:center;
  gap:9px;
  direction:ltr;
}

.signal{
  width:18px;
  height:12px;
  display:flex;
  gap:2px;
  align-items:end;
}

.signal span{
  width:3px;
  background:var(--text);
  border-radius:2px;
}

.signal span:nth-child(1){height:4px}
.signal span:nth-child(2){height:7px}
.signal span:nth-child(3){height:10px}
.signal span:nth-child(4){height:12px}

.battery{
  width:25px;
  height:12px;
  border:1.5px solid var(--text);
  border-radius:3px;
  padding:2px;
  position:relative;
}

.battery::after{
  content:"";
  position:absolute;
  right:-4px;
  top:3px;
  width:2px;
  height:5px;
  border-radius:1px;
  background:var(--text);
}

.battery-level{
  width:82%;
  height:100%;
  background:var(--success);
  border-radius:1px;
}

#home{
  position:absolute;
  inset:54px 0 72px;
  overflow:auto;
  padding:20px 16px 35px;
  z-index:5;
}

.home-title{
  text-align:center;
  margin:8px 0 25px;
}

.home-title h1{
  font-size:30px;
  margin:0;
  font-weight:800;
}

.home-title p{
  color:var(--muted);
  margin:7px 0 0;
  font-size:13px;
}

.app-grid{
  width:100%;
  max-width:850px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(84px,1fr));
  gap:20px 13px;
}

.app{
  min-height:100px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:9px;
  user-select:none;
  cursor:pointer;
  position:relative;
}

.app.dragging{
  opacity:.35;
  transform:scale(.95);
}

.app-icon{
  width:65px;
  height:65px;
  border-radius:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:var(--panel);
  border:1px solid var(--border);
  box-shadow:0 10px 25px rgba(0,0,0,.15);
  overflow:hidden;
  transition:.18s;
}

.app:hover .app-icon{
  transform:translateY(-3px);
}

.app-icon svg{
  width:35px;
  height:35px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.app-name{
  font-size:12px;
  color:var(--text);
  text-align:center;
  max-width:82px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

#dock{
  position:absolute;
  left:14px;
  right:14px;
  bottom:10px;
  height:59px;
  border-radius:22px;
  background:rgba(20,24,34,.72);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
}

body.light #dock{
  background:rgba(255,255,255,.72);
}

.dock-btn{
  width:44px;
  height:44px;
  border-radius:15px;
  background:var(--panel2);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}

.dock-btn svg{
  width:23px;
  height:23px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#panel{
  position:absolute;
  inset:0;
  z-index:100;
  background:var(--bg);
  transform:translateY(100%);
  transition:.28s ease;
  display:flex;
  flex-direction:column;
}

#panel.open{
  transform:translateY(0);
}

.panel-head{
  min-height:58px;
  padding:8px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(20,24,34,.75);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

body.light .panel-head{
  background:rgba(255,255,255,.75);
}

.panel-title{
  font-weight:800;
  font-size:17px;
}

.back-btn{
  width:40px;
  height:40px;
  border-radius:13px;
  background:var(--panel2);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
}

.back-btn svg{
  width:20px;
  height:20px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
}

.panel-body{
  flex:1;
  overflow:auto;
  padding:18px;
}

.screen{
  width:100%;
  height:100%;
  border:0;
  background:white;
}

.fullscreen-panel{
  padding:0;
  overflow:hidden;
}

iframe{
  width:100%;
  height:100%;
  border:0;
}

.section{
  max-width:800px;
  margin:0 auto 18px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin-bottom:11px;
}

.setting-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  min-height:53px;
}

.setting-info{
  flex:1;
}

.setting-title{
  font-size:14px;
  font-weight:700;
}

.setting-desc{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.switch{
  width:47px;
  height:27px;
  border-radius:20px;
  background:#555b68;
  padding:3px;
  transition:.2s;
  flex-shrink:0;
}

.switch i{
  display:block;
  width:21px;
  height:21px;
  background:white;
  border-radius:50%;
  transition:.2s;
}

.switch.on{
  background:var(--accent);
}

.switch.on i{
  transform:translateX(-20px);
}

.primary{
  width:100%;
  padding:13px;
  border-radius:13px;
  background:var(--accent);
  color:white;
  font-weight:700;
}

.secondary{
  width:100%;
  padding:12px;
  border-radius:13px;
  background:var(--panel2);
  color:var(--text);
  margin-top:8px;
}

.danger{
  color:white;
  background:var(--danger);
}

.range{
  width:100%;
}

.wallpaper-preview{
  height:160px;
  border-radius:15px;
  background:var(--panel2);
  background-size:cover;
  background-position:center;
  margin-bottom:10px;
  border:1px solid var(--border);
}

.storage-bar{
  width:100%;
  height:13px;
  border-radius:20px;
  overflow:hidden;
  background:var(--panel2);
  margin:12px 0;
}

.storage-fill{
  height:100%;
  width:0;
  background:var(--accent);
  transition:.4s;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:var(--panel2);
  border-radius:14px;
  padding:14px;
}

.stat small{
  color:var(--muted);
  display:block;
  margin-bottom:5px;
}

.stat strong{
  font-size:16px;
}

.calculator{
  max-width:430px;
  margin:auto;
}

.calc-display{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  min-height:90px;
  display:flex;
  align-items:end;
  justify-content:flex-end;
  font-size:32px;
  overflow:hidden;
  direction:ltr;
  margin-bottom:12px;
}

.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.calc-grid button{
  min-height:62px;
  border-radius:17px;
  background:var(--panel);
  color:var(--text);
  font-size:19px;
  border:1px solid var(--border);
}

.calc-grid button.op{
  background:var(--panel2);
}

.calc-grid button.equal{
  background:var(--accent);
  color:white;
}

.camera-wrap{
  width:100%;
  max-width:700px;
  margin:auto;
}

#cameraVideo{
  width:100%;
  max-height:70vh;
  object-fit:cover;
  background:#000;
  border-radius:20px;
}

.camera-controls{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.camera-controls button{
  flex:1;
  padding:13px;
  border-radius:13px;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
}

#toast{
  position:absolute;
  bottom:82px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#151922;
  color:white;
  padding:11px 17px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:300;
  font-size:12px;
  border:1px solid rgba(255,255,255,.1);
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.halo-card{
  max-width:700px;
  margin:auto;
  text-align:center;
}

.halo-logo{
  width:95px;
  height:95px;
  margin:10px auto 18px;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#3b82f6,#7c3aed);
  color:white;
  font-size:38px;
  font-weight:900;
}

.halo-state{
  margin:18px auto;
  padding:16px;
  border-radius:15px;
  background:var(--panel);
  border:1px solid var(--border);
}

.halo-state strong{
  display:block;
  margin-bottom:6px;
}

.halo-note{
  color:var(--muted);
  font-size:12px;
  line-height:1.8;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
}

@media(max-width:500px){
  .app-grid{
    grid-template-columns:repeat(4,1fr);
    gap:18px 5px;
  }

  .app-icon{
    width:60px;
    height:60px;
  }

  .app{
    min-height:94px;
  }

  #home{
    padding-left:9px;
    padding-right:9px;
  }
}
</style>
</head>

<body>

<div id="os">

  <div id="wallpaper"></div>
  <div id="shade"></div>

  <header id="topbar">
    <div class="status">
      <span id="clock">00:00</span>
      <span id="date"></span>
    </div>

    <div class="status-right">
      <div class="signal">
        <span></span><span></span><span></span><span></span>
      </div>

      <span id="wifiStatus">Wi-Fi</span>

      <div class="battery">
        <div class="battery-level"></div>
      </div>
    </div>
  </header>

  <main id="home">

    <div class="home-title">
      <h1>Roham OS</h1>
      <p>سیستم‌عامل Roham</p>
    </div>

    <div id="appGrid" class="app-grid"></div>

  </main>

  <nav id="dock">
    <button class="dock-btn" onclick="openApp('settings')" aria-label="Settings">
      <svg viewBox="0 0 24 24">
        <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 1.7-.06-.06A1.7 1.7 0 0 0 16.16 18a1.7 1.7 0 0 0-1 .62 1.7 1.7 0 0 0-.34 1.01v.09h-2.4v-.09A1.7 1.7 0 0 0 10.6 18a1.7 1.7 0 0 0-1.88.34l-.06.06-1.7-1.7.06-.06A1.7 1.7 0 0 0 7.36 15a1.7 1.7 0 0 0-.62-1 1.7 1.7 0 0 0-1.01-.34h-.09v-2.4h.09A1.7 1.7 0 0 0 7.36 10a1.7 1.7 0 0 0-.34-1.88l-.06-.06 1.7-1.7.06.06A1.7 1.7 0 0 0 10.6 6a1.7 1.7 0 0 0 1-.62 1.7 1.7 0 0 0 .34-1.01v-.09h2.4v.09A1.7 1.7 0 0 0 15.16 6a1.7 1.7 0 0 0 1.88-.34l.06-.06 1.7 1.7-.06.06A1.7 1.7 0 0 0 18.64 9a1.7 1.7 0 0 0 .62 1 1.7 1.7 0 0 0 1.01.34h.09v2.4h-.09A1.7 1.7 0 0 0 18.64 13a1.7 1.7 0 0 0 .76 2Z"/>
      </svg>
    </button>

    <button class="dock-btn" onclick="openApp('camera')" aria-label="Camera">
      <svg viewBox="0 0 24 24">
        <path d="M4 7h3l1.5-2h7L17 7h3v12H4Z"/>
        <circle cx="12" cy="13" r="3.5"/>
      </svg>
    </button>

    <button class="dock-btn" onclick="openApp('calculator')" aria-label="Calculator">
      <svg viewBox="0 0 24 24">
        <rect x="5" y="3" width="14" height="18" rx="2"/>
        <path d="M8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 18h2M14 18h2"/>
      </svg>
    </button>
  </nav>

  <div id="panel">

    <div class="panel-head">
      <button class="back-btn" onclick="closePanel()">
        <svg viewBox="0 0 24 24">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <div id="panelTitle" class="panel-title">Roham OS</div>

      <div style="width:40px"></div>
    </div>

    <div id="panelBody" class="panel-body"></div>

  </div>

  <div id="toast"></div>

</div>

/* =========================================================
   APP ORDER
   ========================================================= */

function loadApps(){

  try{

    const saved = localStorage.getItem(APP_KEY);

    if(saved){

      const ids = JSON.parse(saved);

      const ordered = [];

      ids.forEach(id=>{
        const found = defaultApps.find(a=>a.id===id);
        if(found) ordered.push(found);
      });

      defaultApps.forEach(app=>{
        if(!ordered.some(a=>a.id===app.id)){
          ordered.push(app);
        }
      });

      return ordered;

    }

  }catch(e){}

  return [...defaultApps];
}


function saveApps(){

  localStorage.setItem(
    APP_KEY,
    JSON.stringify(apps.map(a=>a.id))
  );

}


/* =========================================================
   RENDER HOME
   ========================================================= */

function renderApps(){

  const grid = document.getElementById("appGrid");

  grid.innerHTML = "";

  apps.forEach((app,index)=>{

    const el = document.createElement("div");

    el.className = "app";
    el.draggable = true;
    el.dataset.index = index;

    el.innerHTML = `
      <div class="app-icon" style="width:${settings.iconSize}px;height:${settings.iconSize}px">
        ${app.icon}
      </div>
      <div class="app-name">${escapeHTML(app.name)}</div>
    `;

    el.addEventListener("click",()=>{
      openApp(app.id);
    });

    el.addEventListener("dragstart",e=>{
      e.dataTransfer.setData("text/plain",index);
      el.classList.add("dragging");
    });

    el.addEventListener("dragend",()=>{
      el.classList.remove("dragging");
    });

    el.addEventListener("dragover",e=>{
      e.preventDefault();
    });

    el.addEventListener("drop",e=>{

      e.preventDefault();

      const from = Number(
        e.dataTransfer.getData("text/plain")
      );

      const to = Number(index);

      if(from === to) return;

      const moved = apps.splice(from,1)[0];

      apps.splice(to,0,moved);

      saveApps();
      renderApps();

      toast("جای برنامه تغییر کرد");

    });

    grid.appendChild(el);

  });

}


function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

let facingMode = "environment";


async function startCamera(){

  try{

    stopCamera();

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:facingMode
        },
        audio:false
      });

    const video =
      document.getElementById("cameraVideo");

    if(video){

      video.srcObject = cameraStream;

    }

  }catch(error){

    alert(
      "دسترسی دوربین داده نشد یا دوربین در این محیط قابل استفاده نیست."
    );

  }

}


function stopCamera(){

  if(cameraStream){

    cameraStream.getTracks().forEach(
      track=>track.stop()
    );

    cameraStream = null;

  }

}


function switchCamera(){

  facingMode =
    facingMode === "environment"
    ? "user"
    : "environment";

  startCamera();

}


function takePhoto(){

  const video =
    document.getElementById("cameraVideo");

  const canvas =
    document.getElementById("cameraCanvas");

  if(!video || !canvas || !cameraStream){

    toast("دوربین فعال نیست");
    return;

  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob(blob=>{

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;
    a.download =
      "Roham-Camera-" +
      Date.now() +
      ".jpg";

    a.click();

    URL.revokeObjectURL(url);

  },"image/jpeg",.92);

}

          <button class="equal" onclick="calcResult()">=</button>

        </div>

      </div>
    `
  );

}


function calcInput(value){

  calcValue += value;

  updateCalc();

}


function calcClear(){

  calcValue = "";

  updateCalc();

}


function calcBack(){

  calcValue =
    calcValue.slice(0,-1);

  updateCalc();

}


function updateCalc(){

  document.getElementById(
    "calcDisplay"
  ).textContent =
    calcValue || "0";

}


function calcResult(){

  try{

    if(!/^[0-9+\-*/%.() ]+$/.test(calcValue)){
      throw new Error();
    }

    const result =
      Function(
        `"use strict"; return (${calcValue})`
      )();

    if(!Number.isFinite(result)){
      throw new Error();
    }

    calcValue = String(result);

    updateCalc();

  }catch(e){

    calcValue = "";

    document.getElementById(
      "calcDisplay"
    ).textContent = "خطا";

  }

}

async function updateStorage(){

  try{

    if(!navigator.storage ||
       !navigator.storage.estimate){

      throw new Error();

    }

    const estimate =
      await navigator.storage.estimate();

    const usage =
      estimate.usage || 0;

    const quota =
      estimate.quota || 0;

    const free =
      Math.max(quota-usage,0);

    const percent =
      quota
      ? (usage/quota)*100
      : 0;

    document.getElementById(
      "storageUsed"
    ).textContent =
      formatBytes(usage);

    document.getElementById(
      "storageQuota"
    ).textContent =
      formatBytes(quota);

    document.getElementById(
      "storageFree"
    ).textContent =
      formatBytes(free);

    document.getElementById(
      "storagePercent"
    ).textContent =
      percent.toFixed(1)+"%";

    document.getElementById(
      "storageFill"
    ).style.width =
      Math.min(percent,100)+"%";

  }catch(e){

    document.getElementById(
      "storageUsed"
    ).textContent = "نامشخص";

    document.getElementById(
      "storageQuota"
    ).textContent = "نامشخص";

    document.getElementById(
      "storageFree"
    ).textContent = "نامشخص";

    document.getElementById(
      "storagePercent"
    ).textContent = "—";

  }

}


function formatBytes(bytes){

  if(!bytes) return "0 B";

  const units =
    ["B","KB","MB","GB","TB"];

  const i =
    Math.floor(
      Math.log(bytes)/Math.log(1024)
    );

  return (
    bytes / Math.pow(1024,i)
  ).toFixed(
    i === 0 ? 0 : 2
  ) +
  " " +
  units[i];

}

let recorder = null;
let recordedChunks = [];

  openPanel(

    `

        <div class="card">

          <h3>ضبط صدا</h3>

            id="recordState"

              class="primary"
              onclick="startRecording()">
              شروع
            </button>

              class="secondary"
              onclick="stopRecording()">
              توقف
            </button>

          </div>

        </div>

      </div>
    `
  );

async function startRecording(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio:true
      });

    recordedChunks = [];

    recorder =
      new MediaRecorder(stream);

    recorder.ondataavailable = e=>{

      if(e.data.size){
        recordedChunks.push(e.data);
      }

    };

    recorder.onstop = ()=>{

      const blob =
        new Blob(
          recordedChunks,
          {type:"audio/webm"}
        );

      const url =
        URL.createObjectURL(blob);

      const a =
        document.createElement("a");

      a.href = url;
      a.download =
        "Roham-Recording-" +
        Date.now() +
        ".webm";

      a.click();

      URL.revokeObjectURL(url);

      stream.getTracks().forEach(
        track=>track.stop()
      );

      const state =
        document.getElementById(
          "recordState"
        );

      if(state){
        state.textContent =
          "ضبط ذخیره شد";
      }

    };

    recorder.start();

    document.getElementById(
      "recordState"
    ).textContent =
      "در حال ضبط...";

  }catch(e){

    alert(
      "دسترسی میکروفون داده نشد."
    );

  }

}


function stopRecording(){

  if(
    recorder &&
    recorder.state !== "inactive"
  ){

    recorder.stop();

  }

}

            اتصال مستقیم به Bluetooth دستگاه در نسخهٔ وب محدود است.
          </div>

        </div>

      </div>
    `
  );

}


function toggleBluetooth(){

  settings.bluetooth =
    !settings.bluetooth;

  saveSettings();

  const sw =
    document.getElementById(
      "bluetoothSwitch"
    );

  if(sw){
    sw.classList.toggle(
      "on",
      settings.bluetooth
    );
  }

  toast(
    settings.bluetooth
    ? "Bluetooth روشن شد"
    : "Bluetooth خاموش شد"
  );

}


/* =========================================================
   AIRPLANE MODE
   ========================================================= */

function openAirplane(){

  openPanel(

    `
      <div class="section">

        <div class="card">

          <div class="setting-row">

            <div class="setting-info">

              <div class="setting-title">
                حالت هواپیما

              <div class="setting-desc">
                این کلید فقط وضعیت رابط Roham OS را تغییر می‌دهد.

    `
  );

}

/* =========================================================
   SETTINGS
   ========================================================= */

function openSettings(){

  openPanel(
    "Settings",
    `
      <div class="section">

        <div class="card">

          <h3>ظاهر</h3>

          <div class="setting-row">

            <div class="setting-info">
              <div class="setting-title">
                حالت تاریک
              </div>
              <div class="setting-desc">
                تغییر حالت روشن و تاریک Roham OS
              </div>
            </div>

            <button
              id="darkSwitch"
              class="switch ${settings.dark?"on":""}"
              onclick="toggleDark()">
              <i></i>
            </button>

          </div>

          <div style="margin-top:18px">

            <div class="setting-title">
              اندازه آیکون‌ها
            </div>

            <input
              class="range"
              type="range"
              min="50"
              max="85"
              value="${settings.iconSize}"
              oninput="changeIconSize(this.value)">

          </div>

        </div>


        <div class="card">

          <h3>Wallpaper</h3>

          <div
            id="wallPreview"
            class="wallpaper-preview">
          </div>

          <input
            id="wallpaperInput"
            type="file"
            accept="image/*"
            style="width:100%">

          <button
            class="secondary"
            onclick="removeWallpaper()">
            حذف Wallpaper
          </button>

        </div>


        <div class="card">

          <h3>اتصالات</h3>

          <div class="setting-row">

            <div class="setting-info">
              <div class="setting-title">Wi-Fi</div>
            </div>

            <button
              class="switch ${settings.wifi?"on":""}"
              onclick="toggleSettingFromSettings('wifi')">
              <i></i>
            </button>

          </div>

          <div class="setting-row">

            <div class="setting-info">
              <div class="setting-title">Bluetooth</div>
            </div>

            <button
              class="switch ${settings.bluetooth?"on":""}"
              onclick="toggleSettingFromSettings('bluetooth')">
              <i></i>
            </button>

          </div>

          <div class="setting-row">

            <div class="setting-info">
              <div class="setting-title">Airplane Mode</div>
            </div>

            <button
              class="switch ${settings.airplane?"on":""}"
              onclick="toggleSettingFromSettings('airplane')">
              <i></i>
            </button>

          </div>

        </div>


        <div class="card">

          <h3>مدیریت برنامه‌ها</h3>

          <p class="setting-desc">
            برای جابه‌جایی برنامه‌ها، روی آیکون برنامه نگه دارید
            و آن را بکشید.
          </p>

          <button
            class="secondary"
            onclick="resetLayout()">
            بازنشانی ترتیب برنامه‌ها
          </button>

        </div>


        <div class="card">

          <h3>دستگاه</h3>

          <div class="stat-grid">

            <div class="stat">
              <small>سیستم</small>
              <strong>Roham OS</strong>
            </div>

            <div class="stat">
              <small>نسخه</small>
              <strong>Beta 5</strong>
            </div>

            <div class="stat">
              <small>معماری</small>
              <strong>Web Prototype</strong>
            </div>

            <div class="stat">
              <small>Roham Account</small>
              <strong>حذف شده</strong>
            </div>

          </div>

        </div>


        <div class="card">

          <button
            class="primary"
            onclick="resetAll()">
            بازنشانی کامل Roham OS
          </button>

        </div>

      </div>
    `
  );

  setTimeout(()=>{

    const input =
      document.getElementById(
        "wallpaperInput"
      );

    if(input){

      input.addEventListener(
        "change",
        handleWallpaper
      );

    }

    const preview =
      document.getElementById(
        "wallPreview"
      );

    if(preview && settings.wallpaper){

      preview.style.backgroundImage =
        `url("${settings.wallpaper}")`;

    }

  },50);

}


function toggleDark(){

  settings.dark =
    !settings.dark;

  saveSettings();
  applySettings();

  const sw =
    document.getElementById(
      "darkSwitch"
    );

  if(sw){
    sw.classList.toggle(
      "on",
      settings.dark
    );
  }

}


function changeIconSize(value){

  settings.iconSize =
    Number(value);

  saveSettings();
  renderApps();

}


function handleWallpaper(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = e=>{

    settings.wallpaper =
      e.target.result;

    saveSettings();
    applySettings();

    const preview =
      document.getElementById(
        "wallPreview"
      );

    if(preview){

      preview.style.backgroundImage =
        `url("${settings.wallpaper}")`;

    }

    toast("Wallpaper تغییر کرد");

  };

  reader.readAsDataURL(file);

}


function removeWallpaper(){

  settings.wallpaper = "";

  saveSettings();
  applySettings();

  const preview =
    document.getElementById(
      "wallPreview"
    );

  if(preview){

    preview.style.backgroundImage =
      "none";

  }

  toast("Wallpaper حذف شد");

}


function toggleSettingFromSettings(name){

  settings[name] =
    !settings[name];

  if(
    name === "airplane" &&
    settings.airplane
  ){

    settings.wifi = false;
    settings.bluetooth = false;

  }

  saveSettings();

  openSettings();

}


function resetLayout(){

  apps = [...defaultApps];

  saveApps();

  renderApps();

  toast("ترتیب برنامه‌ها بازنشانی شد");

}


function resetAll(){

  if(
    !confirm(
      "همه تنظیمات Roham OS بازنشانی شود؟"
    )
  ) return;

  localStorage.removeItem(APP_KEY);
  localStorage.removeItem(SETTINGS_KEY);

  location.reload();

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      el.classList.remove("show");
    },1800);

}


/* =========================================================
   KEYBOARD CALCULATOR SUPPORT
   ========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    const panel =
      document.getElementById("panel");

    if(!panel.classList.contains("open"))
      return;

    const title =
      document.getElementById(
        "panelTitle"
      ).textContent;

    if(title !== "Calculator")
      return;

    const key = event.key;

    if(
      /[0-9+\-*/%.]/.test(key)
    ){

      calcInput(key);

    }else if(key === "Enter"){

      calcResult();

    }else if(key === "Backspace"){

      calcBack();

    }else if(key === "Escape"){

      calcClear();

    }

  }
);


/* =========================================================
   START
   ========================================================= */

renderApps();

</script>

</html>

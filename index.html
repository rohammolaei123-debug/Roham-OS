<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b1020">
<title>Roham OS</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#07101f;
  --panel:#101a2d;
  --panel2:#16233a;
  --text:#f5f7fb;
  --muted:#9eabc1;
  --accent:#5d8cff;
  --danger:#ff5c6c;
  --border:rgba(255,255,255,.09);
}

body.light{
  --bg:#eef2f7;
  --panel:#ffffff;
  --panel2:#e7ecf4;
  --text:#101522;
  --muted:#667085;
  --border:rgba(0,0,0,.09);
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,BlinkMacSystemFont,"Segoe UI",
    Tahoma,Arial,sans-serif;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#os{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(93,140,255,.20),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(130,70,255,.18),transparent 30%),
    var(--bg);
}

#wallpaper{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  opacity:.9;
  pointer-events:none;
}

#shade{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.18);
  pointer-events:none;
}

#topbar{
  position:absolute;
  z-index:10;
  top:0;
  left:0;
  right:0;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  font-size:13px;
  font-weight:600;
  background:rgba(0,0,0,.12);
  backdrop-filter:blur(12px);
}

.status{
  display:flex;
  gap:10px;
  align-items:center;
}

#home{
  position:absolute;
  inset:42px 0 68px;
  overflow:auto;
  padding:25px 18px;
  z-index:2;
}

#appGrid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px 12px;
  max-width:900px;
  margin:auto;
}

.app{
  min-width:0;
  text-align:center;
  color:var(--text);
  user-select:none;
  touch-action:none;
}

.appIcon{
  width:62px;
  height:62px;
  margin:auto;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,var(--panel2),var(--panel));
  border:1px solid var(--border);
  box-shadow:0 8px 22px rgba(0,0,0,.20);
  font-size:25px;
  overflow:hidden;
  transition:.18s;
}

.app:active .appIcon{
  transform:scale(.92);
}

.appName{
  margin-top:7px;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.svgIcon{
  width:32px;
  height:32px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

#dock{
  position:absolute;
  z-index:10;
  bottom:10px;
  left:12px;
  right:12px;
  height:56px;
  border-radius:20px;
  background:rgba(15,25,43,.75);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.dockBtn{
  width:45px;
  height:45px;
  border-radius:14px;
  background:transparent;
  color:var(--text);
  font-size:22px;
}

#window{
  position:absolute;
  z-index:30;
  inset:0;
  display:none;
  background:var(--bg);
}

#window.show{
  display:flex;
  flex-direction:column;
}

.windowBar{
  height:54px;
  flex:none;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 13px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.windowTitle{
  font-size:16px;
  font-weight:700;
  flex:1;
}

.backBtn,
.moreBtn{
  width:40px;
  height:40px;
  border-radius:13px;
  background:var(--panel2);
  color:var(--text);
  font-size:20px;
}

#windowContent{
  flex:1;
  overflow:auto;
  padding:15px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.cardTitle{
  font-weight:700;
  margin-bottom:8px;
}

.muted{
  color:var(--muted);
  font-size:13px;
  line-height:1.7;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.row:last-child{
  border-bottom:0;
}

.rowText{
  min-width:0;
}

.rowTitle{
  font-weight:600;
}

.rowSub{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.switch{
  width:49px;
  height:28px;
  border-radius:30px;
  padding:3px;
  background:#4b5568;
  flex:none;
}

.switch i{
  display:block;
  width:22px;
  height:22px;
  border-radius:50%;
  background:white;
  transition:.2s;
}

.switch.on{
  background:var(--accent);
}

.switch.on i{
  transform:translateX(-21px);
}

.action{
  width:100%;
  padding:13px;
  border-radius:14px;
  background:var(--accent);
  color:white;
  font-weight:700;
  margin-top:8px;
}

.action.secondary{
  background:var(--panel2);
  color:var(--text);
}

.action.danger{
  background:var(--danger);
}

input[type=file]{
  width:100%;
  margin-top:10px;
}

#toast{
  position:absolute;
  z-index:100;
  bottom:82px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#111827;
  color:white;
  padding:10px 15px;
  border-radius:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  font-size:13px;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.iframeApp{
  width:100%;
  height:100%;
  border:0;
  border-radius:12px;
  background:white;
}

.calc{
  max-width:420px;
  margin:auto;
}

.calcDisplay{
  width:100%;
  min-height:75px;
  border-radius:18px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:20px;
  font-size:28px;
  text-align:left;
  direction:ltr;
  overflow:hidden;
}

.calcGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.calcGrid button{
  height:58px;
  border-radius:15px;
  background:var(--panel2);
  color:var(--text);
  font-size:20px;
}

.calcGrid button.equal{
  background:var(--accent);
  color:white;
}

.cameraBox{
  width:100%;
  max-width:650px;
  margin:auto;
}

#cameraVideo{
  width:100%;
  max-height:65vh;
  object-fit:cover;
  border-radius:20px;
  background:#000;
}

.cameraButtons{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.cameraButtons button{
  flex:1;
}

#photos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

#photos img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  border-radius:10px;
}

.storageBar{
  height:15px;
  border-radius:20px;
  background:var(--panel2);
  overflow:hidden;
  margin:12px 0;
}

.storageFill{
  height:100%;
  width:0;
  background:var(--accent);
  transition:.4s;
}

.bigNumber{
  font-size:30px;
  font-weight:800;
}

.halo{
  max-width:520px;
  margin:auto;
}

.haloLogo{
  width:92px;
  height:92px;
  border-radius:28px;
  margin:20px auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#6e7cff,#7655ff);
  color:white;
  font-size:46px;
  font-weight:900;
}

.haloStatus{
  text-align:center;
  font-weight:700;
  margin:12px 0;
}

.haloConnect{
  width:100%;
  height:55px;
  border-radius:18px;
  background:var(--accent);
  color:white;
  font-size:17px;
  font-weight:800;
}

.dragging{
  opacity:.45;
}

@media(max-width:380px){
  #appGrid{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px 7px;
  }

  .appIcon{
    width:54px;
    height:54px;
    border-radius:16px;
  }
}
</style>
</head>

<body>

<div id="os">

  <div id="wallpaper"></div>
  <div id="shade"></div>

  <div id="topbar">
    <div id="clock">00:00</div>
    <div class="status">
      <span id="wifiStatus">Wi-Fi</span>
      <span id="btStatus">BT</span>
      <span>▮▮▮</span>
      <span>100%</span>
    </div>
  </div>

  <main id="home">
    <div id="appGrid"></div>
  </main>

  <div id="dock">
    <button class="dockBtn" onclick="openApp('settings')">⚙</button>
    <button class="dockBtn" onclick="openApp('camera')">⌾</button>
    <button class="dockBtn" onclick="openApp('calculator')">＋</button>
    <button class="dockBtn" onclick="openApp('files')">▣</button>
  </div>

  <div id="window">
    <div class="windowBar">
      <button class="backBtn" onclick="closeApp()">‹</button>
      <div class="windowTitle" id="windowTitle">Roham OS</div>
      <button class="moreBtn" onclick="closeApp()">×</button>
    </div>
    <div id="windowContent"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
"use strict";

/* =========================
   ROHAM OS CORE
========================= */

const APP_KEY = "rohamLayoutV6";
const SETTINGS_KEY = "rohamSettingsV6";

const apps = {

  google:{
    name:"Google",
    icon:"G",
    url:"https://www.google.com/"
  },

  chrome:{
    name:"Chrome",
    icon:"◉",
    url:"https://www.google.com/chrome/"
  },

  youtube:{
    name:"YouTube",
    icon:"▶",
    url:"https://www.youtube.com/"
  },

  gmail:{
    name:"Gmail",
    icon:"M",
    url:"https://mail.google.com/"
  },

  ytmusic:{
    name:"YouTube Music",
    icon:"♪",
    url:"https://music.youtube.com/"
  },

  photos:{
    name:"Google Photos",
    icon:"◌",
    url:"https://photos.google.com/"
  },

  onedrive:{
    name:"OneDrive",
    icon:"☁",
    url:"https://onedrive.live.com/"
  },

  playstore:{
    name:"Play Store",
    icon:"▶",
    url:"https://play.google.com/"
  },

  halovpn:{
    name:"HaloVPN",
    icon:"H",
    type:"halo"
  },

  rohamai:{
    name:"Roham AI",
    icon:"AI",
    url:"https://rohammolaei123-debug.github.io/Roham-Ai/"
  },

  camera:{
    name:"Camera",
    icon:"⌾",
    type:"camera"
  },

  calculator:{
    name:"Calculator",
    icon:"＋",
    type:"calculator"
  },

  files:{
    name:"Files",
    icon:"▣",
    type:"files"
  },

  storage:{
    name:"Storage",
    icon:"▤",
    type:"storage"
  },

  recorder:{
    name:"Recorder",
    icon:"●",
    type:"recorder"
  },

  sim:{
    name:"SIM",
    icon:"SIM",
    type:"sim"
  },

  wifi:{
    name:"Wi-Fi",
    icon:"⌁",
    type:"wifi"
  },

  bluetooth:{
    name:"Bluetooth",
    icon:"ᛒ",
    type:"bluetooth"
  },

  airplane:{
    name:"Airplane Mode",
    icon:"✈",
    type:"airplane"
  },

  settings:{
    name:"Settings",
    icon:"⚙",
    type:"settings"
  }
};

const defaultOrder = Object.keys(apps);

let order = loadOrder();
let settings = loadSettings();

let currentApp = null;
let cameraStream = null;
let recorder = null;
let recorderChunks = [];
let calcValue = "";


/* =========================
   STORAGE
========================= */

function loadOrder(){
  try{
    const saved = JSON.parse(localStorage.getItem(APP_KEY));
    if(Array.isArray(saved)){
      return [
        ...saved.filter(x => apps[x]),
        ...defaultOrder.filter(x => !saved.includes(x))
      ];
    }
  }catch(e){}
  return [...defaultOrder];
}

function saveOrder(){
  localStorage.setItem(APP_KEY,JSON.stringify(order));
}

function loadSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem(SETTINGS_KEY));
    return Object.assign({
      theme:"dark",
      iconSize:62,
      wallpaper:"",
      wifi:false,
      bluetooth:false,
      airplane:false
    },saved || {});
  }catch(e){
    return {
      theme:"dark",
      iconSize:62,
      wallpaper:"",
      wifi:false,
      bluetooth:false,
      airplane:false
    };
  }
}

function saveSettings(){
  localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
}


/* =========================
   CLOCK
========================= */

function updateClock(){
  const d = new Date();
  document.getElementById("clock").textContent =
    d.toLocaleTimeString("fa-IR",{
      hour:"2-digit",
      minute:"2-digit"
    });
}

setInterval(updateClock,1000);
updateClock();


/* =========================
   THEME
========================= */

function applySettings(){

  document.body.classList.toggle(
    "light",
    settings.theme === "light"
  );

  document.getElementById("wallpaper").style.backgroundImage =
    settings.wallpaper
      ? `url("${settings.wallpaper}")`
      : "";

  document.querySelectorAll(".appIcon").forEach(icon=>{
    icon.style.width = settings.iconSize + "px";
    icon.style.height = settings.iconSize + "px";
  });

  document.getElementById("wifiStatus").textContent =
    settings.wifi ? "Wi-Fi ✓" : "Wi-Fi";

  document.getElementById("btStatus").textContent =
    settings.bluetooth ? "BT ✓" : "BT";
}


/* =========================
   APP GRID
========================= */

function renderApps(){

  const grid = document.getElementById("appGrid");
  grid.innerHTML = "";

  order.forEach(id=>{

    const app = apps[id];
    if(!app) return;

    const el = document.createElement("div");
    el.className = "app";
    el.draggable = true;
    el.dataset.id = id;

    el.innerHTML = `
      <div class="appIcon">${app.icon}</div>
      <div class="appName">${app.name}</div>
    `;

    el.onclick = ()=>openApp(id);

    el.addEventListener("dragstart",()=>{
      el.classList.add("dragging");
    });

    el.addEventListener("dragend",()=>{
      el.classList.remove("dragging");
      saveOrder();
    });

    el.addEventListener("dragover",e=>{
      e.preventDefault();

      const dragging =
        document.querySelector(".dragging");

      if(!dragging || dragging===el) return;

      const rect = el.getBoundingClientRect();

      const after =
        e.clientY > rect.top + rect.height/2;

      grid.insertBefore(
        dragging,
        after ? el.nextSibling : el
      );

      order =
        [...grid.querySelectorAll(".app")]
          .map(x=>x.dataset.id);
    });

    grid.appendChild(el);
  });

  applySettings();
}

renderApps();


/* =========================
   APP WINDOW
========================= */

function openApp(id){

  currentApp = id;

  const app = apps[id];

  document.getElementById("windowTitle").textContent =
    app.name;

  const content =
    document.getElementById("windowContent");

  content.innerHTML = "";

  document.getElementById("window")
    .classList.add("show");

  if(app.type === "settings"){
    showSettings();
    return;
  }

  if(app.type === "camera"){
    showCamera();
    return;
  }

  if(app.type === "calculator"){
    showCalculator();
    return;
  }

  if(app.type === "files"){
    showFiles();
    return;
  }

  if(app.type === "storage"){
    showStorage();
    return;
  }

  if(app.type === "recorder"){
    showRecorder();
    return;
  }

  if(app.type === "sim"){
    showSIM();
    return;
  }

  if(app.type === "wifi"){
    showWiFi();
    return;
  }

  if(app.type === "bluetooth"){
    showBluetooth();
    return;
  }

  if(app.type === "airplane"){
    showAirplane();
    return;
  }

  if(app.type === "halo"){
    showHaloVPN();
    return;
  }

  if(app.url){
    const iframe =
      document.createElement("iframe");

    iframe.className = "iframeApp";
    iframe.src = app.url;
    iframe.allow =
      "camera; microphone; geolocation; autoplay";

    content.appendChild(iframe);
    return;
  }
}

function closeApp(){

  stopCamera();

  if(recorder && recorder.state === "recording"){
    recorder.stop();
  }

  document.getElementById("window")
    .classList.remove("show");

  document.getElementById("windowContent")
    .innerHTML = "";

  currentApp = null;
}


/* =========================
   SETTINGS
========================= */

function showSettings(){

  const c = document.getElementById("windowContent");

  c.innerHTML = `

    <div class="card">
      <div class="cardTitle">Roham OS</div>
      <div class="muted">
        تنظیمات اصلی سیستم
      </div>
    </div>

    <div class="card">

      <div class="row">
        <div class="rowText">
          <div class="rowTitle">حالت تاریک</div>
          <div class="rowSub">ظاهر سیستم</div>
        </div>

        <button
          class="switch ${settings.theme==="dark"?"on":""}"
          onclick="toggleTheme(this)">
          <i></i>
        </button>
      </div>

      <div class="row">
        <div class="rowText">
          <div class="rowTitle">Wi-Fi</div>
          <div class="rowSub">
            ${settings.wifi ? "روشن" : "خاموش"}
          </div>
        </div>

        <button
          class="switch ${settings.wifi?"on":""}"
          onclick="toggleWiFi(this)">
          <i></i>
        </button>
      </div>

      <div class="row">
        <div class="rowText">
          <div class="rowTitle">Bluetooth</div>
          <div class="rowSub">
            ${settings.bluetooth ? "روشن" : "خاموش"}
          </div>
        </div>

        <button
          class="switch ${settings.bluetooth?"on":""}"
          onclick="toggleBluetooth(this)">
          <i></i>
        </button>
      </div>

      <div class="row">
        <div class="rowText">
          <div class="rowTitle">Airplane Mode</div>
          <div class="rowSub">
            ${settings.airplane ? "روشن" : "خاموش"}
          </div>
        </div>

        <button
          class="switch ${settings.airplane?"on":""}"
          onclick="toggleAirplane(this)">
          <i></i>
        </button>
      </div>

    </div>

    <div class="card">

      <div class="cardTitle">
        اندازه آیکن‌ها
      </div>

      <input
        type="range"
        min="45"
        max="90"
        value="${settings.iconSize}"
        oninput="changeIconSize(this.value)"
        style="width:100%">

    </div>

    <div class="card">

      <div class="cardTitle">
        والپیپر
      </div>

      <input
        type="file"
        accept="image/*"
        onchange="setWallpaper(event)">

      <button
        class="action secondary"
        onclick="removeWallpaper()">
        حذف والپیپر
      </button>

    </div>

    <div class="card">

      <div class="cardTitle">
        مدیریت برنامه‌ها
      </div>

      <div class="muted">
        برای جابه‌جایی برنامه‌ها، روی آیکن برنامه
        نگه دار و آن را بکش.
      </div>

    </div>

    <div class="card">

      <button
        class="action danger"
        onclick="resetRoham()">
        بازنشانی Roham OS
      </button>

    </div>

    <div class="card">
      <div class="cardTitle">درباره سیستم</div>
      <div class="muted">
        Roham OS Web Prototype<br>
        نسخه 6.0
      </div>
    </div>
  `;
}


/* =========================
   SETTINGS ACTIONS
========================= */

function toggleTheme(){

  settings.theme =
    settings.theme === "dark"
      ? "light"
      : "dark";

  saveSettings();
  applySettings();
  showSettings();
}

function toggleWiFi(){

  settings.wifi = !settings.wifi;

  if(settings.wifi)
    settings.airplane = false;

  saveSettings();
  applySettings();
  showSettings();

  toast(
    settings.wifi
      ? "Wi-Fi روشن شد"
      : "Wi-Fi خاموش شد"
  );
}

function toggleBluetooth(){

  settings.bluetooth =
    !settings.bluetooth;

  if(settings.bluetooth)
    settings.airplane = false;

  saveSettings();
  applySettings();
  showSettings();

  toast(
    settings.bluetooth
      ? "Bluetooth روشن شد"
      : "Bluetooth خاموش شد"
  );
}

function toggleAirplane(){

  settings.airplane =
    !settings.airplane;

  if(settings.airplane){
    settings.wifi = false;
    settings.bluetooth = false;
  }

  saveSettings();
  applySettings();
  showSettings();
}

function changeIconSize(value){

  settings.iconSize =
    Number(value);

  saveSettings();
  applySettings();
}

function setWallpaper(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = e=>{

    settings.wallpaper =
      e.target.result;

    saveSettings();
    applySettings();

  c.innerHTML = `

        </button>

        <button
          class="action secondary"
          onclick="takePhoto()">

        </button>

      </div>

      <div id="photos"></div>

    </div>
  `;

  startCamera();
}

async function startCamera(){

  try{

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"environment"
        },
        audio:false
      });

    const video =
      document.getElementById("cameraVideo");

    if(video){
      video.srcObject =
        cameraStream;
    }

  }catch(error){

    toast(
      "دسترسی دوربین داده نشد"
    );
  }
}

function takePhoto(){

  const video =
    document.getElementById("cameraVideo");

  if(!video || !video.videoWidth){

    toast("ابتدا دوربین را روشن کن");
    return;
  }

  const canvas =
    document.createElement("canvas");

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  canvas.getContext("2d")
    .drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

  const img =
    document.createElement("img");

  img.src =
    canvas.toDataURL("image/jpeg",.9);

  document.getElementById("photos")
    .prepend(img);

  toast("عکس گرفته شد");
}

function stopCamera(){

  if(cameraStream){

    cameraStream
      .getTracks()
      .forEach(track=>track.stop());

    cameraStream = null;
  }
}

function showCalculator(){

  const c =
    document.getElementById("windowContent");

  calcValue = "";

  c.innerHTML = `

    <div class="calc">

      <div
        id="calcDisplay"
        class="calcDisplay">
        0
      </div>

      <div class="calcGrid">

        <button onclick="calcClear()">C</button>
        <button onclick="calcInput('(')">(</button>
        <button onclick="calcInput(')')">)</button>
        <button onclick="calcInput('/')">÷</button>

        <button onclick="calcInput('7')">7</button>
        <button onclick="calcInput('8')">8</button>
        <button onclick="calcInput('9')">9</button>
        <button onclick="calcInput('*')">×</button>

        <button onclick="calcInput('4')">4</button>
        <button onclick="calcInput('5')">5</button>
        <button onclick="calcInput('6')">6</button>
        <button onclick="calcInput('-')">−</button>

        <button onclick="calcInput('1')">1</button>
        <button onclick="calcInput('2')">2</button>
        <button onclick="calcInput('3')">3</button>
        <button onclick="calcInput('+')">+</button>

        <button onclick="calcInput('0')">0</button>
        <button onclick="calcInput('.')">.</button>
        <button onclick="calcBack()">⌫</button>
        <button
          class="equal"
          onclick="calcEqual()">
          =
        </button>

      </div>
    </div>
  `;
}

function calcInput(value){

  calcValue += value;

  document.getElementById("calcDisplay")
    .textContent =
      calcValue || "0";
}

function calcClear(){

  calcValue = "";

  document.getElementById("calcDisplay")
    .textContent = "0";
}

function calcBack(){

  calcValue =
    calcValue.slice(0,-1);

  document.getElementById("calcDisplay")
    .textContent =
      calcValue || "0";
}

function calcEqual(){

  try{

    if(!/^[0-9+\-*/().\s]+$/.test(calcValue))
      throw new Error();

    const result =
      Function(
        '"use strict";return (' +
        calcValue +
        ')'
      )();

    calcValue =
      String(result);

    document.getElementById("calcDisplay")
      .textContent =
        calcValue;

  }catch(e){

    calcValue = "";

    document.getElementById("calcDisplay")
      .textContent =
        "خطا";
  }
}

async function showStorage(){

  const c =
    document.getElementById("windowContent");

  c.innerHTML = `
    <div class="card">
      <div class="cardTitle">
        Storage
      </div>

      <div id="storageInfo">

        <div
          class="storageFill"
          id="storageFill">
        </div>
      </div>
    </div>
  `;

  if(!navigator.storage ||
     !navigator.storage.estimate){

    document.getElementById("storageInfo")
      .textContent =
      "مرورگر اطلاعات دقیق حافظه را ارائه نمی‌دهد.";

    return;
  }

  const data =
    await navigator.storage.estimate();

  const usage =
    data.usage || 0;

  const quota =
    data.quota || 0;

  const percent =
    quota
      ? Math.min(100,(usage/quota)*100)
      : 0;

  document.getElementById("storageInfo")
    .innerHTML = `
      <div class="bigNumber">
        ${percent.toFixed(1)}%
      </div>

      <div class="muted">
        استفاده‌شده:
        ${formatBytes(usage)}
        <br>
        سهم قابل استفاده:
        ${formatBytes(quota)}
      </div>
    `;

  document.getElementById("storageFill")
    .style.width =
      percent + "%";
}

function showRecorder(){

  const c =
    document.getElementById("windowContent");

  c.innerHTML = `

    <div class="card">

        Voice Recorder
      </div>

      <div
        id="recStatus"
        class="muted">
        آماده ضبط
      </div>

      <button
        class="action"
        onclick="startRecording()">
        شروع ضبط
      </button>

      <button
        class="action danger"
        onclick="stopRecording()">
        توقف
      </button>

      <div id="recordings"></div>

    </div>
  `;
}

async function startRecording(){

  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });

    recorder =
      new MediaRecorder(stream);

    recorderChunks = [];

    recorder.ondataavailable =
      e=>{
        if(e.data.size)
          recorderChunks.push(e.data);
      };

    recorder.onstop = ()=>{

      const blob =
        new Blob(
          recorderChunks,
          {type:"audio/webm"}
        );

      const url =
        URL.createObjectURL(blob);

      const audio =
        document.createElement("audio");

      audio.controls = true;
      audio.src = url;

      const box =
        document.getElementById("recordings");

      box.prepend(audio);

      stream.getTracks()
        .forEach(t=>t.stop());

      document.getElementById("recStatus")
        .textContent =
        "ضبط پایان یافت";
    };

    recorder.start();

    document.getElementById("recStatus")
      .textContent =
      "در حال ضبط...";

  }catch(e){

    toast(
      "دسترسی میکروفون داده نشد"
    );
  }
}

function stopRecording(){

  if(
    recorder &&
    recorder.state === "recording"
  ){
    recorder.stop();
  }
}

/* =========================
   HELPERS
========================= */

function formatBytes(bytes){

  if(!bytes) return "0 B";

  const units =
    ["B","KB","MB","GB","TB"];

  const i =
    Math.floor(
      Math.log(bytes)/Math.log(1024)
    );

  return (
    bytes /
    Math.pow(1024,i)
  ).toFixed(2)
  + " " +
  units[i];
}

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent =
    message;

  el.classList.add("show");

  clearTimeout(window.__toast);

  window.__toast =
    setTimeout(()=>{
      el.classList.remove("show");
    },1800);
}
